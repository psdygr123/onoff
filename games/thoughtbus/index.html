<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>생각 버스 기사 (The Thought Bus Driver)</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }
        body {
            background-color: #1A1B26;
            color: #C0CAF5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }
        #game-container {
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            border-radius: 16px;
            background: #24283B;
            padding: 20px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        header {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            padding: 0 8px;
        }
        h1 {
            font-size: 1.3rem;
            color: #7AA2F7;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .stats-bar {
            display: flex;
            gap: 16px;
        }
        .stat-item {
            font-size: 0.9rem;
            background: rgba(255,255,255,0.05);
            padding: 6px 12px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .stat-value {
            font-weight: bold;
            color: #E0AF68;
        }
        canvas {
            max-width: 100%; height: auto; touch-action: none; /* 온앤오프 연결용 수정(모바일): 화면 폭에 맞춰 축소 */
            background: #16161E;
            border-radius: 12px;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
        }
        #stage-wrap { position: relative; max-width: 100%; line-height: 0; }
        #ui-overlay {
            line-height: normal;
            position: absolute;
            inset: 0; /* 온앤오프 연결용 수정: 캔버스 크기를 그대로 따라가도록 */
            pointer-events: none;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: rgba(22, 22, 30, 0.88);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            transition: opacity 0.3s ease;
            opacity: 0;
            z-index: 10;
        }
        #ui-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }
        .modal-card {
            text-align: center;
            max-width: 420px;
            padding: 28px;
            background: #24283B;
            border-radius: 16px;
            border: 1px solid rgba(255,255,255,0.15);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .modal-card h2 {
            font-size: 1.7rem;
            margin-bottom: 12px;
            color: #9ECE6A;
        }
        .modal-card p {
            font-size: 0.95rem;
            color: #A9B1D6;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .btn {
            background: linear-gradient(135deg, #7AA2F7 0%, #7DCFFF 100%);
            color: #1A1B26;
            border: none;
            padding: 12px 28px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 24px;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(122, 162, 247, 0.3);
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(122, 162, 247, 0.5);
        }
        footer {
            margin-top: 12px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.85rem;
            color: #565F89;
            gap: 12px; flex-wrap: wrap;
        }
        .progress-container {
            width: 200px;
            height: 10px;
            background: #1A1B26;
            border-radius: 5px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.1);
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #7AA2F7, #9ECE6A);
            transition: width 0.1s linear;
        }
        /* ===== 온앤오프 연결용 추가: 터치 조작(좌우 버튼) ===== */
        #pad { display: none; margin-top: 14px; width: 100%; max-width: 500px; gap: 12px; }
        #pad button { flex: 1; height: 78px; font-size: 2rem; border-radius: 18px; border: 2px solid rgba(122,162,247,0.45);
                      background: rgba(122,162,247,0.14); color: #C0CAF5; touch-action: none; -webkit-tap-highlight-color: transparent; }
        #pad button.on { background: rgba(122,162,247,0.40); }
        .keys-only { display: inline; }
        .touch-only { display: none; }
        @media (pointer: coarse) {
            #pad { display: flex; }
            .keys-only { display: none; }
            .touch-only { display: inline; }
        }
        @media (max-width: 640px) {
            body { min-height: 100dvh; overflow-y: auto; justify-content: flex-start; padding: 8px 0; }
            #game-container { padding: 12px; width: 100%; max-width: 100%; border-radius: 12px; box-shadow: none; }
            h1 { font-size: 1.05rem; }
            .stat-item { font-size: 0.78rem; padding: 4px 9px; }
            .modal-card { padding: 16px; max-width: 92%; }
            .modal-card h2 { font-size: 1.3rem; margin-bottom: 8px; }
            .modal-card p { font-size: 0.85rem; margin-bottom: 14px; line-height: 1.5; }
            .btn { padding: 10px 24px; }
            footer { flex-direction: column; align-items: stretch; gap: 8px; }
            .progress-container { width: 140px; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <header>
        <h1>🚌 생각 버스 기사</h1>
        <div class="stats-bar">
            <div class="stat-item">탑승한 생각: <span id="passenger-count" class="stat-value">0</span>명</div>
        </div>
    </header>

    <div id="stage-wrap">
    <canvas id="gameCanvas" width="500" height="500"></canvas>

    <div id="ui-overlay" class="active">
        <div class="modal-card">
            <h2 id="modal-title">생각 버스 기사</h2>
            <p id="modal-desc">
                당신은 버스 기사입니다. 목적지(소중한 가치)를 향해 운전하세요.<br><br>
                도중에 부정적인 생각 승객들이 올라타 소리를 질러도, 싸우거나 멈추지 마세요.<br>
                생각이 존재하도록 둔 채 온전히 전방 도로에만 집중해 계속 운전하세요!
            </p>
            <button id="start-btn" class="btn">운전 시작하기</button>
        </div>
    </div>
    </div>
    <div id="pad"><button id="pad-l" aria-label="왼쪽으로">◀</button><button id="pad-r" aria-label="오른쪽으로">▶</button></div>

    <footer>
        <div><span class="keys-only">조작: 좌우 방향키 (← →) 또는 A / D</span><span class="touch-only">조작: 아래 ◀ ▶ 버튼을 누르고 있으면 이동</span></div>
        <div style="display:flex; align-items:center; gap:8px;">
            <span>목적지 남은 거리:</span>
            <div class="progress-container">
                <div id="progress-bar" class="progress-bar"></div>
            </div>
        </div>
    </footer>
</div>

<script>
    // --- Audio Engine ---
    class SoundEngine {
        constructor() { this.ctx = null; }
        init() {
            if (!this.ctx) {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }
        playShout() {
            if (!this.ctx) return;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(300, this.ctx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.15, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start();
            osc.stop(this.ctx.currentTime + 0.2);
        }
        playGoal() {
            if (!this.ctx) return;
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((f, i) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.value = f;
                const t = this.ctx.currentTime + i * 0.12;
                gain.gain.setValueAtTime(0.2, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + 0.4);
            });
        }
    }

    const sound = new SoundEngine();

    // --- Game Variables ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const uiOverlay = document.getElementById('ui-overlay');
    const modalTitle = document.getElementById('modal-title');
    const modalDesc = document.getElementById('modal-desc');
    const startBtn = document.getElementById('start-btn');
    const passengerCountEl = document.getElementById('passenger-count');
    const progressBar = document.getElementById('progress-bar');

    let gameState = 'START';
    let keys = {};
    let distanceTraveled = 0;
    const targetDistance = 1000;
    let shakeAmount = 0;

    const bus = {
        x: 220,
        y: 380,
        width: 60,
        height: 90,
        speed: 4
    };

    const road = {
        left: 100,
        right: 400,
        stripeOffset: 0
    };

    const thoughtMessages = [
        "넌 또 실패할 거야!",
        "당장 차 멈춰!",
        "의미 없는 짓이야",
        "남들은 훨씬 앞서가",
        "네가 뭘 할 수 있는데?",
        "불안하지도 않아?",
        "그냥 다 포기해!"
    ];

    let activePassengers = [];
    let obstacles = [];

    class Passenger {
        constructor(text) {
            this.text = text;
            this.x = Math.random() * 260 + 120;
            this.y = Math.random() * 100 + 40;
            this.opacity = 0;
        }
        update() {
            if (this.opacity < 1) this.opacity += 0.05;
        }
        draw() {
            ctx.save();
            ctx.globalAlpha = this.opacity;
            ctx.fillStyle = '#F7768E';
            ctx.font = 'bold 13px sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(this.text, this.x, this.y);
            ctx.restore();
        }
    }

    function spawnObstacle() {
        obstacles.push({
            x: Math.random() * 240 + 110,
            y: -40,
            width: 40,
            height: 40,
            speed: 3
        });
    }

    function initGame() {
        distanceTraveled = 0;
        bus.x = 220;
        activePassengers = [];
        obstacles = [];
        shakeAmount = 0;
        passengerCountEl.innerText = '0';
        progressBar.style.width = '0%';
    }

    function update() {
        if (gameState !== 'PLAYING') return;

        distanceTraveled += 1.5;
        progressBar.style.width = `${Math.min((distanceTraveled / targetDistance) * 100, 100)}%`;

        // 도로 차선 이동
        road.stripeOffset = (road.stripeOffset + 4) % 40;

        // 조작
        if (keys['ArrowLeft'] || keys['a']) bus.x -= bus.speed;
        if (keys['ArrowRight'] || keys['d']) bus.x += bus.speed;

        // 도로 이탈 방지
        if (bus.x < road.left) bus.x = road.left;
        if (bus.x + bus.width > road.right) bus.x = road.right - bus.width;

        // 새로운 생각 승객 탑승 (일정 거리마다)
        if (Math.floor(distanceTraveled) % 150 === 0 && activePassengers.length < 7) {
            const msg = thoughtMessages[activePassengers.length % thoughtMessages.length];
            activePassengers.push(new Passenger(msg));
            passengerCountEl.innerText = activePassengers.length;
            sound.playShout();
            shakeAmount = 10;
        }

        activePassengers.forEach(p => p.update());

        // 장애물 이동 및 생성
        if (Math.random() < 0.015 && obstacles.length < 3) {
            spawnObstacle();
        }

        obstacles.forEach(obs => {
            obs.y += obs.speed;
            // 충돌 체크 (단순 둔화 연출)
            if (
                bus.x < obs.x + obs.width &&
                bus.x + bus.width > obs.x &&
                bus.y < obs.y + obs.height &&
                bus.y + bus.height > obs.y
            ) {
                shakeAmount = 15;
                obs.hit = true;
            }
        });
        obstacles = obstacles.filter(o => !o.hit && o.y < canvas.height + 50); // 부딪힌 것·화면 밖으로 나간 것 정리

        // 화면 흔들림 감소
        if (shakeAmount > 0) shakeAmount *= 0.9;

        // 승리 조건
        if (distanceTraveled >= targetDistance) {
            gameState = 'CLEAR';
            sound.playGoal();
            try { if (window.parent !== window) parent.postMessage({ source: "onoff-game", type: "progress", payload: { label: "목적지 도착 (생각 " + activePassengers.length + "개와 함께)", percent: 100 } }, "*"); } catch (e) { /* 무시 */ }
            showModal(
                "🏆 목적지 도착!",
                `축하합니다! 뒤에서 ${activePassengers.length}개의 부정적인 생각들이 끊임없이 소리를 질렀지만,<br>버스 핸들을 놓지 않고 온전히 삶의 목적지에 도착했습니다!`,
                "다시 운전하기"
            );
        }
    }

    function draw() {
        ctx.save();
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 화면 흔들림 효과 (생각 승객들의 소음 연출)
        if (shakeAmount > 0.5) {
            ctx.translate((Math.random() - 0.5) * shakeAmount, (Math.random() - 0.5) * shakeAmount);
        }

        // 잔디밭 배경
        ctx.fillStyle = '#1D202F';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        // 도로
        ctx.fillStyle = '#24283B';
        ctx.fillRect(road.left, 0, road.right - road.left, canvas.height);

        // 중앙 차선
        ctx.strokeStyle = '#E0AF68';
        ctx.lineWidth = 4;
        ctx.setLineDash([20, 20]);
        ctx.lineDashOffset = -road.stripeOffset;
        ctx.beginPath();
        ctx.moveTo(canvas.width / 2, 0);
        ctx.lineTo(canvas.width / 2, canvas.height);
        ctx.stroke();
        ctx.setLineDash([]);

        // 장애물 그리기
        ctx.fillStyle = '#F7768E';
        obstacles.forEach(obs => {
            ctx.fillRect(obs.x, obs.y, obs.width, obs.height);
        });

        // 버스 (플레이어)
        ctx.fillStyle = '#7AA2F7';
        ctx.shadowColor = '#7AA2F7';
        ctx.shadowBlur = 10;
        ctx.fillRect(bus.x, bus.y, bus.width, bus.height);
        ctx.shadowBlur = 0;

        // 버스 창문 & 전조등
        ctx.fillStyle = '#1A1B26';
        ctx.fillRect(bus.x + 8, bus.y + 12, bus.width - 16, 20);
        ctx.fillStyle = '#E0AF68';
        ctx.fillRect(bus.x + 6, bus.y + 4, 12, 6);
        ctx.fillRect(bus.x + bus.width - 18, bus.y + 4, 12, 6);

        // 승객 생각 텍스트 표시
        activePassengers.forEach(p => p.draw());

        ctx.restore();
    }

    function showModal(title, desc, btnText) {
        modalTitle.innerHTML = title;
        modalDesc.innerHTML = desc;
        startBtn.innerText = btnText;
        uiOverlay.classList.add('active');
    }

    function hideModal() {
        uiOverlay.classList.remove('active');
    }

    startBtn.addEventListener('click', () => {
        sound.init();
        hideModal();
        initGame();
        gameState = 'PLAYING';
    });

    window.addEventListener('keydown', e => { if (e.key.indexOf('Arrow') === 0) e.preventDefault(); keys[e.key] = true; });   /* 온앤오프 연결용 수정: 방향키가 바깥 페이지를 스크롤하지 않게 */
    window.addEventListener('keyup', e => keys[e.key] = false);

    // --- 터치 버튼 (온앤오프 연결용 추가) ---
    [['pad-l', 'ArrowLeft'], ['pad-r', 'ArrowRight']].forEach(([id, k]) => {
        const el = document.getElementById(id);
        const on = e => { e.preventDefault(); keys[k] = true; el.classList.add('on'); try { el.setPointerCapture(e.pointerId); } catch (_) {} };
        const off = () => { keys[k] = false; el.classList.remove('on'); };
        el.addEventListener('pointerdown', on); el.addEventListener('pointerup', off); el.addEventListener('pointercancel', off);
    });
    window.addEventListener('blur', () => { keys = {}; });

    function gameLoop() {
        update();
        draw();
        requestAnimationFrame(gameLoop);
    }
    requestAnimationFrame(gameLoop);

    // --- 온앤오프 플랫폼 연결: 플랫폼 안(iframe)에서 열렸을 때만 준비 신호를 보냅니다(단독으로 열어도 그대로 동작). ---
    try { if (window.parent !== window) parent.postMessage({ source: "onoff-game", type: "ready" }, "*"); } catch (e) { /* 무시 */ }
</script>
</body>
</html>
