<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="810" viewBox="0 0 1440 810" role="img" aria-label="따뜻한 수채화풍 개인 갤러리. 창가, 꽃 장식, 빈 전시 벽과 나무 바닥">
<defs>
