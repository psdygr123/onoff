  <radialGradient id="lamp" cx=".5" cy=".5" r=".6"><stop stop-color="#fffaac" stop-opacity=".92"/><stop offset=".42" stop-color="#ffdb7b" stop-opacity=".62"/><stop offset="1" stop-color="#f8bd5e" stop-opacity="0"/></radialGradient>
  <filter id="paint" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".17" numOctaves="3" seed="5" stitchTiles="stitch" result="grain"/><feColorMatrix in="grain" type="saturate" values="0" result="gray"/><feComponentTransfer in="gray"><feFuncA type="linear" slope=".09"/></feComponentTransfer></filter>
