  <linearGradient id="plaster" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ffebc5" stop-opacity=".5"/><stop offset="1" stop-color="#c99668" stop-opacity=".27"/></linearGradient>
  <linearGradient id="wood" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d0a173"/><stop offset=".4" stop-color="#af794f"/><stop offset=".68" stop-color="#845636"/><stop offset="1" stop-color="#be9266"/></linearGradient>
  <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d6ac7d"/><stop offset=".7" stop-color="#a57351"/><stop offset="1" stop-color="#744b32"/></linearGradient>
