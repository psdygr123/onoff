name: Autelia extended validation

on:
  push:
    branches: [chore/stabilization-baseline-20261119]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start isolated game server
        run: |
          mkdir -p /tmp/autelia-shots
          python3 -m http.server 8801 --directory games/autelia > /tmp/autelia-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8801/index.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Extended tests
        env:
          GAME_URL: http://localhost:8801
          SHOTS: /tmp/autelia-shots
        run: |
          set -uo pipefail
          overall=0
          for test in \
            tests/prologue/playthrough.js \
            tests/prologue/state_tests.js \
            tests/prologue/profile_tests.js \
            tests/prologue/skip_tests.js \
            tests/prologue/obstacle_tests.js \
            tests/prologue/optional_npc.js \
            tests/quest_kinds.js \
            tests/drops.js \
            tests/mind_stats.js \
            tests/stat_gate.js \
            tests/tutorial.js \
            tests/act1_story.js; do
            echo "::group::$test"
            timeout 240 node "games/autelia/$test" > /tmp/result.log 2>&1
            status=$?
            cat /tmp/result.log
            if [ "$status" -ne 0 ] || grep -Eq '^FAIL ' /tmp/result.log; then
              echo "::error title=Test failed::$test exit=$status"
              overall=1
            fi
            echo "::endgroup::"
          done
          exit "$overall"
      - name: Upload screenshots and server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: extended-validation-evidence
          path: |
            /tmp/autelia-shots/
            /tmp/autelia-server.log
          if-no-files-found: ignore
