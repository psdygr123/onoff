name: Autelia extended validation

on:
  push:
    branches: [chore/stabilization-baseline-20261119]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  extended:
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: prologue-playthrough
            tests: tests/prologue/playthrough.js
          - group: prologue-state
            tests: tests/prologue/state_tests.js tests/prologue/profile_tests.js tests/prologue/skip_tests.js tests/prologue/obstacle_tests.js tests/prologue/optional_npc.js
          - group: core-progression
            tests: tests/quest_kinds.js tests/drops.js tests/mind_stats.js tests/stat_gate.js
          - group: story-and-tutorial
            tests: tests/tutorial.js tests/act1_story.js
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test runtime
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start isolated game server
        run: |
          mkdir -p /tmp/autelia-shots
          python3 -m http.server 8801 --directory games/autelia > /tmp/autelia-server.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://localhost:8801/index.html >/dev/null && exit 0; sleep 1; done
          exit 1
      - name: Run extended suite
        env:
          GAME_URL: http://localhost:8801
          SHOTS: /tmp/autelia-shots
          TESTS: ${{ matrix.tests }}
        shell: bash
        run: |
          set -uo pipefail
          overall=0
          for test in $TESTS; do
            echo "::group::$test"
            timeout --signal=TERM --kill-after=10s 480s node "games/autelia/$test" 2>&1 | tee /tmp/autelia-shots/$(basename "$test").log
            status=${PIPESTATUS[0]}
            if [ "$status" -ne 0 ] || grep -Eq '^FAIL ' /tmp/autelia-shots/$(basename "$test").log; then
              echo "::error title=Test failed::$test exit=$status"
              overall=1
            fi
            echo "::endgroup::"
          done
          exit "$overall"
      - name: Upload test logs and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-${{ matrix.group }}
          path: |
            /tmp/autelia-shots/
            /tmp/autelia-server.log
          if-no-files-found: ignore
