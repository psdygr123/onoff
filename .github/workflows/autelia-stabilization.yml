name: Autelia stabilization baseline

on:
  push:
    branches:
      - chore/stabilization-baseline-20261119
      - feat/gallery-raster-original-art-20261119
      - fix/gallery-visual-layout-20261119
      - feat/gallery-immersive-art-20261119
      - fix/gallery-thumbnails-and-fragments-20261121
      - feat/optional-perma-missions-30-20261121
      - feat/prologue-real-bridge-20261121
      - feat/prologue-story-mission-placement-20261121
      - feat/reality-reward-neutral-20261121
      - feat/mission-evidence-20261121
      - feat/act1-real-bridge-20261121
      - feat/activity-catalog-130-20261121
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Start game HTTP server
        run: |
          mkdir -p /tmp/autelia-shots
          python3 -m http.server 8801 --directory games/autelia > /tmp/autelia-http.log 2>&1 &
          python3 -m http.server 8803 --directory . > /tmp/onoff-http.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8801/index.html >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/autelia-http.log
          exit 1
      - name: Check JS syntax
        run: |
          for file in js/*.js games/autelia/js/*.js games/autelia/tests/gallery_room.js games/autelia/tests/gallery_dual_entry.js games/autelia/tests/platform_gallery_entry.js games/autelia/tests/missions_30.js games/autelia/tests/prologue_real_bridge.js; do node --check "$file" || exit 1; done
      - name: Browser regression suite
        env:
          GAME_URL: http://localhost:8801
          SHOTS: /tmp/autelia-shots
        shell: bash
        run: |
          set +e
          set -uo pipefail
          overall=0
          for test in tests/regression_main.js tests/fatigue.js tests/survey_pss.js tests/survey_perma.js tests/act1_hideout.js tests/feedback_tests.js tests/reality_growth_v2.js tests/missions_30.js tests/prologue_real_bridge.js tests/mission_evidence.js tests/act1_real_bridge.js tests/gallery_room.js tests/gallery_dual_entry.js tests/platform_gallery_entry.js tests/prologue_resume_smoke.js; do
            echo "::group::$test"
            node "games/autelia/$test" > /tmp/one-test.log 2>&1
            code=$?
            cat /tmp/one-test.log
            if [ "$code" -ne 0 ] || grep -Eq '^FAIL ' /tmp/one-test.log; then
              echo "::error title=Regression failure::$test failed (exit $code)"
              overall=1
            fi
            echo "::endgroup::"
          done
          exit "$overall"
      - name: Upload gallery preview and regression evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autelia-stabilization-evidence
          path: |
            /tmp/autelia-shots/
            /tmp/autelia-http.log
          if-no-files-found: ignore
